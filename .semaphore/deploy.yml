version: v1.0
name: bump packages deploy
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204

blocks:
  - name: Deploy
    task:
      # bump-vps holds VPS_HOST, VPS_USER, and the deploy key at ~/.ssh/id_ed25519.
      secrets:
        - name: bump-vps
      jobs:
        - name: ssh deploy
          commands:
            - checkout
            - chmod 600 ~/.ssh/id_ed25519
            - ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "bash -s" < scripts/deploy-remote.sh
